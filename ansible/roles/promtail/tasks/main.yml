---
- name: Download Promtail
  become: yes
  get_url:
    url: "https://github.com/grafana/loki/releases/download/v2.7.0/promtail-linux-amd64.zip"
    dest: /tmp/promtail-linux-amd64.zip

- name: Install unzip package
  become: yes
  yum:
    name: unzip
    state: present

- name: Unarchive Promtail
  become: yes
  unarchive:
    src: /tmp/promtail-linux-amd64.zip
    dest: /usr/local/bin/
    remote_src: yes
    creates: /usr/local/bin/promtail-linux-amd64

- name: Create Promtail config directory
  become: yes
  file:
    path: /etc/promtail
    state: directory

- name: Template Promtail config file
  become: yes
  template:
    src: config-promtail.yml.j2
    dest: /etc/promtail/config.yml

- name: Template Promtail service file
  become: yes
  template:
    src: promtail.service.j2
    dest: /etc/systemd/system/promtail.service

- name: Reload systemd and start Promtail service
  become: yes
  systemd:
    name: promtail
    daemon_reload: yes
    state: started
    enabled: yes
