- name: Update VITE_API_BASE_PATH in .env file
  lineinfile:
    path: "{{ frontend_repository_path }}/.env"
    regexp: '^VITE_API_BASE_PATH='
    line: "VITE_API_BASE_PATH=http://{{ backend_public_ip }}:3000"
    create: yes
  delegate_to: localhost

- name: Install dependencies
  ansible.builtin.command:
    cmd: npm install
    chdir: "{{ frontend_repository_path }}"

- name: Install Prettier config for ESLint
  ansible.builtin.command:
    cmd: npm install --save-dev eslint-config-prettier
    chdir: "{{ frontend_repository_path }}"

- name: Build frontend
  command: npm run build
  args:
    chdir: "{{ frontend_repository_path }}"
  delegate_to: localhost

- name: Sync frontend build to S3 bucket
  community.aws.s3_sync:
    bucket: "{{ s3_bucket_name }}"
    file_root: "{{ frontend_repository_path }}/dist"
    key_prefix: ''
    delete: true
    region: "{{ aws_region }}"
  delegate_to: localhost
