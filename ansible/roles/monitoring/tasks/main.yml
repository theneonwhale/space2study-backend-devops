---
- name: Install Docker
  become: yes
  yum:
    name: docker
    state: present

- name: Start Docker service
  become: yes
  service:
    name: docker
    state: started
    enabled: yes

- name: Add ec2-user to docker group
  become: yes
  user:
    name: ec2-user
    groups: docker
    append: yes

- name: Install Docker Compose
  become: yes
  get_url:
    url: https://github.com/docker/compose/releases/latest/download/docker-compose-Linux-x86_64
    dest: /usr/local/bin/docker-compose
    mode: '0755'

- name: Create monitoring directories
  become: yes
  file:
    path: "{{ item }}"
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: '0755'
  loop:
    - /opt/monitoring
    - /opt/monitoring/prometheus
    - /opt/monitoring/grafana/provisioning/datasources
    - /opt/monitoring/grafana/provisioning/dashboards
    - /opt/monitoring/loki

- name: Force-remove old config files to ensure changes are applied
  become: yes
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/monitoring/loki/loki-config.yml
    - /opt/monitoring/docker-compose.yml

- name: Create Loki config file directly on server
  become: yes
  blockinfile:
    path: /opt/monitoring/loki/loki-config.yml
    create: yes
    owner: ec2-user
    group: ec2-user
    mode: '0644'
    block: |
      auth_enabled: false

      server:
        http_listen_port: 3100

      ingester:
        lifecycler:
          address: 127.0.0.1
          ring:
            kvstore:
              store: inmemory
            replication_factor: 1
          final_sleep: 0s
        chunk_idle_period: 5m
        chunk_retain_period: 1m
        max_transfer_retries: 0

      schema_config:
        configs:
          - from: 2020-10-24
            store: boltdb-shipper
            object_store: filesystem
            schema: v11
            index:
              prefix: index_
              period: 24h

      storage_config:
        boltdb_shipper:
          active_index_directory: /tmp/loki/boltdb-shipper-active
          cache_location: /tmp/loki/boltdb-shipper-cache
          cache_ttl: 24h
          shared_store: filesystem
        filesystem:
          directory: /tmp/loki/chunks

      compactor:
        working_directory: /tmp/loki/compactor
        shared_store: filesystem

      limits_config:
        reject_old_samples: true
        reject_old_samples_max_age: 168h

      chunk_store_config:
        max_look_back_period: 0s

      table_manager:
        retention_deletes_enabled: false
        retention_period: 0s

- name: Copy remaining configuration files
  become: yes
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: ec2-user
    group: ec2-user
    mode: '0644'
  loop:
    - { src: 'prometheus.yml', dest: '/opt/monitoring/prometheus/prometheus.yml' }
    - { src: 'datasource.yml', dest: '/opt/monitoring/grafana/provisioning/datasources/datasource.yml' }
    - { src: 'dashboard-provider.yml', dest: '/opt/monitoring/grafana/provisioning/dashboards/dashboard-provider.yml' }
    - { src: 'dashboard.json', dest: '/opt/monitoring/grafana/provisioning/dashboards/dashboard.json' }

- name: Template Docker Compose file
  become: yes
  template:
    src: docker-compose.yml.j2
    dest: /opt/monitoring/docker-compose.yml
    owner: ec2-user
    group: ec2-user
    mode: '0644'

- name: Start monitoring stack
  become: yes
  command:
    cmd: docker-compose up -d --force-recreate
    chdir: /opt/monitoring
