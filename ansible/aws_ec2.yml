plugin: amazon.aws.aws_ec2
regions:
  - us-east-1
filters:
  tag:Name: space2study-backend
strict: False
keyed_groups:
  - key: tags.Name
    prefix: ''
hostnames:
  - public_ip_address
compose:
  ansible_host: public_ip_address
  ansible_user: ec2-user
  ansible_ssh_private_key_file: ~/.ssh/space2study-key
