
name: CI/CD

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18.x
          uses: actions/setup-node@v4
          with:
            node-version: 18.x

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy:
    name: 'Deploy'
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Set up Terraform'
        uses: hashicorp/setup-terraform@v2

      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Or your desired region

      - name: 'Terraform Init'
        run: terraform init
        working-directory: ./terraform

      - name: 'Terraform Apply'
        run: terraform apply -auto-approve
        working-directory: ./terraform
        env:
          TF_VAR_allowed_ip_addresses: ${{ secrets.ALLOWED_IP_ADDRESSES }}
          TF_VAR_mongodb_atlas_public_key: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
          TF_VAR_mongodb_atlas_private_key: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
          TF_VAR_mongodb_atlas_org_id: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
          TF_VAR_superadmin_email: ${{ secrets.SUPERADMIN_EMAIL }}
          TF_VAR_superadmin_password: ${{ secrets.SUPERADMIN_PASSWORD }}
          TF_VAR_mail_user: ${{ secrets.MAIL_USER }}
          TF_VAR_gmail_client_id: ${{ secrets.GMAIL_CLIENT_ID }}
          TF_VAR_gmail_client_secret: ${{ secrets.GMAIL_CLIENT_SECRET }}
          TF_VAR_gmail_refresh_token: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          TF_VAR_jwt_access_secret: ${{ secrets.JWT_ACCESS_SECRET }}
          TF_VAR_jwt_refresh_secret: ${{ secrets.JWT_REFRESH_SECRET }}
          TF_VAR_jwt_reset_secret: ${{ secrets.JWT_RESET_SECRET }}
          TF_VAR_jwt_confirm_secret: ${{ secrets.JWT_CONFIRM_SECRET }}

      - name: 'Get instance IP'
        id: instance_ip
        run: echo "::set-output name=ip::$(terraform output -raw backend_public_ip)"
        working-directory: ./terraform

      - name: 'Get backend secret id'
        id: backend_secret_id
        run: echo "::set-output name=id::$(terraform output -raw backend_secret_id)"
        working-directory: ./terraform

      - name: 'Get aws region'
        id: aws_region
        run: echo "::set-output name=region::$(terraform output -raw aws_region)"
        working-directory: ./terraform

      - name: 'Get s3 bucket name'
        id: s3_bucket_name
        run: echo "::set-output name=name::$(terraform output -raw s3_bucket_name)"
        working-directory: ./terraform

      - name: 'Checkout backend repository'
        uses: actions/checkout@v4
        with:
          path: backend

      - name: 'Checkout frontend repository'
        uses: actions/checkout@v4
        with:
          repository: theneonwhale/space2study-frontend-devops
          path: frontend

      - name: 'Run Ansible Playbook'
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: main.yml
          directory: ./backend/ansible
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          inventory: |
            [aws_ec2]
                        ${{ needs.terraform.outputs.ip }} ansible_user=ec2-user
          extra_vars: |
            backend_secret_id=${{ needs.terraform.outputs.backend_secret_id }}
            aws_region=${{ needs.terraform.outputs.aws_region }}
            s3_bucket_name=${{ needs.terraform.outputs.s3_bucket_name }}
            backend_public_ip=${{ needs.terraform.outputs.backend_public_ip }}
            frontend_repository_path=${{ github.workspace }}/frontend
