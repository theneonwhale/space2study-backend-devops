# Docker Compose for AWS Deployment
# Uses AWS Secrets Manager for sensitive data

services:
  backend:
    build: ..  # Build from parent directory (where Dockerfile is)
    container_name: space2study-backend-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production  # Generated from AWS Secrets Manager
    restart: unless-stopped
    volumes:
      - ../logs:/app/logs  # Mount logs from parent directory
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

# To deploy with AWS Secrets (from aws/ directory):
# 1. cd ~/space2study-app/backend/aws
# 2. chmod +x load-secrets.sh
# 3. ./load-secrets.sh
# 4. docker-compose -f docker-compose.prod.yml up -d --build
